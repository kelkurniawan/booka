<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Simbol Marky</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; display: flex; align-items: center; justify-content: center; line-height: 0">
<sc-if value="{{isA}}" hint-placeholder-val="{{ false }}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" role="img" aria-label="Simbol Marky: m tebal">
<path d="M22 79V43a14.5 14.5 0 0 1 29 0v36M51 43a14.5 14.5 0 0 1 29 0v36" fill="none" stroke="{{color}}" stroke-width="16"></path>
</svg>
</sc-if>
<sc-if value="{{isB}}" hint-placeholder-val="{{ false }}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" role="img" aria-label="Simbol Marky: stempel">
<circle cx="50" cy="22" r="12" fill="{{color}}"></circle>
<rect x="44" y="30" width="12" height="20" fill="{{color}}"></rect>
<rect x="24" y="46" width="52" height="20" rx="6" fill="{{color}}"></rect>
<rect x="16" y="71" width="68" height="11" rx="3" fill="{{color}}"></rect>
</svg>
</sc-if>
<sc-if value="{{isC}}" hint-placeholder-val="{{ false }}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" role="img" aria-label="Simbol Marky: slip lunas">
<defs>
<mask id="mk-slip" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
<rect width="100" height="100" fill="#fff"></rect>
<circle cx="12" cy="50" r="9" fill="#000"></circle>
<circle cx="88" cy="50" r="9" fill="#000"></circle>
<path d="M36 51l9 9 19-19" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
</mask>
</defs>
<rect x="12" y="24" width="76" height="52" rx="10" fill="{{color}}" mask="url(#mk-slip)"></rect>
</svg>
</sc-if>
<sc-if value="{{isD}}" hint-placeholder-val="{{ false }}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" role="img" aria-label="Simbol Marky: m centang">
<path d="M14 76V46a11 11 0 0 1 22 0v30M36 46a11 11 0 0 1 22 0v22l9 9 21-33" fill="none" stroke="{{color}}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</sc-if>
<sc-if value="{{isE}}" hint-placeholder-val="{{ true }}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" role="img" aria-label="Simbol Marky: cap m">
<defs>
<mask id="mk-cap" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140">
<rect x="-20" y="-20" width="140" height="140" fill="#fff"></rect>
<path d="M22 79V43a14.5 14.5 0 0 1 29 0v36M51 43a14.5 14.5 0 0 1 29 0v36" fill="none" stroke="#000" stroke-width="16" transform="translate(50 51) scale(.56) translate(-51 -49.75)"></path>
</mask>
</defs>
<rect x="14" y="14" width="72" height="72" rx="18" fill="{{color}}" mask="url(#mk-cap)" transform="rotate(-8 50 50)"></rect>
</svg>
</sc-if>
<sc-if value="{{isF}}" hint-placeholder-val="{{ false }}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" role="img" aria-label="Simbol Marky: cincin selesai">
<path d="M50 20A30 30 0 1 1 24.02 35" fill="none" stroke="{{color}}" stroke-width="14" stroke-linecap="round"></path>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["A","B","C","D","E","F"],"default":"E"},"size":{"editor":"int","min":12,"max":512,"default":160},"color":{"editor":"color","default":"#2a211c"},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'E';
    return {
      size: this.props.size ?? 160,
      color: this.props.color ?? '#2a211c',
      isA: v === 'A', isB: v === 'B', isC: v === 'C',
      isD: v === 'D', isE: v === 'E', isF: v === 'F',
    };
  }
}
</script>
</body>
</html>
