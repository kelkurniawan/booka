<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hubungi merchant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap">
<style>
body{margin:0}
a{color:#a8532e}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #a8532e;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #faf4ea; color: #453425; font-family: 'DM Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; filter: blur(1px)">
    <span style="font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600">Booking Anda</span>
    <div style="height: 180px; border-radius: 20px; background: #ffffff; border: 1px solid #e8dcc9"></div>
    <div style="height: 120px; border-radius: 20px; background: #453425"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(41,30,20,0.5)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="kontak-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 24px 24px 0 0; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 4px; background: #d9c9b3"></span>
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <h2 id="kontak-h" style="margin: 0; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600">Hubungi Rias by Sekar</h2>
        <span style="font-size: 13px; color: #75624d">Jam balas pesan 09.00–20.00 WIB</span>
      </div>
      <a href="Pesanan.dc.html" aria-label="Tutup" style="width: 44px; height: 44px; margin: -6px -8px 0 0; display: flex; align-items: center; justify-content: center; color: #453425"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
    </div>

    <a href="https://wa.me/" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; border: 2px solid #a8532e; background: #fbf1e8; color: #453425; text-decoration: none">
      <span style="display: flex; align-items: center; gap: 12px">
        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #a8532e; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">WhatsApp</span><span style="font-size: 13px; color: #75624d">Paling cepat dibalas</span></span>
        <span style="font-size: 14px; font-weight: 600; color: #a8532e">Chat</span>
      </span>
      <span style="padding: 10px 12px; border-radius: 10px; background: #ffffff; font-size: 13px; line-height: 1.45; color: #75624d">"Halo Rias by Sekar, saya Ayu. Soal booking BK-7F3A, Sabtu 21 Nov 10.00..."</span>
    </a>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid #e8dcc9; border-radius: 16px; overflow: hidden">
      <sc-for list="{{channels}}" as="c" hint-placeholder-count="6">
        <li style="border-bottom: 1px solid #f3e3d6">
          <a href="{{c.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; color: #453425; text-decoration: none">
            <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #f3e3d6; color: #7d3c20; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{c.mono}}</span>
            <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{c.label}}</span><span style="font-size: 13px; color: #75624d">{{c.handle}}</span></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#75624d" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
    <p style="margin: 0; font-size: 12px; text-align: center; color: #75624d">Hanya kanal yang diaktifkan Rias by Sekar yang tampil di sini.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { channels: [
      { mono: 'Tel', label: 'Telepon', handle: '0812-9876-5432', href: '#' },
      { mono: '@', label: 'Email', handle: 'halo@riasbysekar.id', href: '#' },
      { mono: 'IG', label: 'Instagram', handle: '@riasbysekar', href: '#' },
      { mono: 'Th', label: 'Threads', handle: '@riasbysekar', href: '#' },
      { mono: 'X', label: 'X', handle: '@riasbysekar', href: '#' },
      { mono: 'Tk', label: 'TikTok', handle: '@riasbysekar', href: '#' }
    ] };
  }
}
</script>
</body>
</html>
