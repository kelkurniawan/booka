<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Halaman booking dengan latar bergerak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:3px solid #a8532e;outline-offset:2px}
@keyframes waveA{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,30px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-50px,40px) scale(.9)}}
@keyframes rise{from{transform:translateY(40px);opacity:0}20%{opacity:.9}to{transform:translateY(-320px);opacity:0}}
.is-paused *{animation-play-state:paused !important}
@media (prefers-reduced-motion:no-preference){
  .wv1{animation:waveA 18s linear infinite}.wv2{animation:waveA 26s linear infinite reverse}.wv3{animation:waveA 34s linear infinite}
  .au1{animation:drift1 16s ease-in-out infinite}.au2{animation:drift2 20s ease-in-out infinite}.au3{animation:drift1 24s ease-in-out infinite reverse}
  .pt{animation:rise var(--d) linear infinite;animation-delay:var(--l)}
}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #faf4ea; color: #453425; font-family: 'DM Sans', system-ui, sans-serif">

  <div aria-hidden="true" class="{{bgClass}}" style="position: absolute; left: 0; right: 0; top: 0; height: 360px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent)">
    <sc-if value="{{isWave}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; background: #f3e3d6"></div>
      <svg class="wv1" viewBox="0 0 1560 200" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 70px; width: 200%; height: 180px"><path d="M0 100 Q 195 20 390 100 T 780 100 T 1170 100 T 1560 100 V200 H0Z" fill="#a8532e" fill-opacity="0.18"></path></svg>
      <svg class="wv2" viewBox="0 0 1560 200" preserveAspectRatio="none" style="position: absolute; left: -50%; bottom: 40px; width: 200%; height: 170px"><path d="M0 110 Q 195 40 390 110 T 780 110 T 1170 110 T 1560 110 V200 H0Z" fill="#a8532e" fill-opacity="0.12"></path></svg>
      <svg class="wv3" viewBox="0 0 1560 200" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; width: 200%; height: 150px"><path d="M0 120 Q 195 60 390 120 T 780 120 T 1170 120 T 1560 120 V200 H0Z" fill="#faf4ea"></path></svg>
    </sc-if>
    <sc-if value="{{isAurora}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0; background: #f3e3d6"></div>
      <div class="au1" style="position: absolute; left: -60px; top: -40px; width: 300px; height: 300px; border-radius: 999px; background: radial-gradient(circle, rgba(168,83,46,0.45), transparent 65%)"></div>
      <div class="au2" style="position: absolute; right: -80px; top: 20px; width: 320px; height: 320px; border-radius: 999px; background: radial-gradient(circle, rgba(201,165,138,0.6), transparent 65%)"></div>
      <div class="au3" style="position: absolute; left: 80px; top: 120px; width: 260px; height: 260px; border-radius: 999px; background: radial-gradient(circle, rgba(69,52,37,0.22), transparent 65%)"></div>
    </sc-if>
    <sc-if value="{{isShapes}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0; background: #f3e3d6"></div>
      <sc-for list="{{shapes}}" as="s" hint-placeholder-count="3"><span style="{{s}}"></span></sc-for>
    </sc-if>
    <sc-if value="{{isDots}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0; background: #f3e3d6"></div>
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="14"><span class="pt" style="{{d}}"></span></sc-for>
    </sc-if>
  </div>

  <button type="button" aria-pressed="{{paused}}" aria-label="{{pauseLabel}}" onClick="{{togglePause}}" style="position: absolute; right: 12px; top: 12px; z-index: 2; width: 44px; height: 44px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.85); color: #453425; cursor: pointer; display: flex; align-items: center; justify-content: center">
    <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
    <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg></sc-if>
  </button>
  <div style="position: relative; display: flex; flex-direction: column; gap: 18px; padding: 56px 16px 0">
    <header style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
      <div aria-hidden="true" style="width: 88px; height: 88px; border-radius: 999px; background: #ffffff; border: 3px solid #ffffff; box-shadow: 0 8px 24px rgba(69,52,37,0.15); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600; color: #a8532e">S</div>
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px">Rias by Sekar</h1>
      <p style="margin: 0; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,0.8); font-size: 14px">Makeup wisuda dan pengantin, Bandung</p>
    </header>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
      <div style="padding: 16px; border-radius: 20px; background: #ffffff; border: 1px solid #e8dcc9"><strong>Makeup Wisuda</strong><div style="font-size: 14px; color: #75624d">90 menit, Rp350.000</div></div>
      <div style="padding: 16px; border-radius: 20px; background: #ffffff; border: 1px solid #e8dcc9"><strong>Makeup Pesta</strong><div style="font-size: 14px; color: #75624d">2 jam, Rp450.000</div></div>
      <div style="padding: 16px; border-radius: 20px; background: #ffffff; border: 1px solid #e8dcc9"><strong>Pengantin, akad</strong><div style="font-size: 14px; color: #75624d">3 jam, Rp1.500.000</div></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #ffffff; border-top: 1px solid #e8dcc9">
    <a href="Jadwal.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #a8532e; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none">Pilih jadwal</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","options":["Bentuk","Gelombang","Aurora","Partikel"],"default":"Bentuk","section":"Latar"},"$preview":{"width":390,"height":900}}'>
// Mesin gerak diadaptasi dari Barty-Bart/motion-graphics (MIT): semua posisi = fungsi waktu seek(t),
// loop mulus karena keyframe terakhir == keyframe pertama (seek(D) sama dengan seek(0)).
var D = 12;
var clamp = function (x, a, b) { a = a ?? 0; b = b ?? 1; return Math.min(b, Math.max(a, x)); };
var ease = function (x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
var lerp = function (a, b, k) { return a + (b - a) * k; };
var kf = function (keys) { return function (t) { if (t <= keys[0][0]) return keys[0][1]; for (var i = 1; i < keys.length; i++) { var a = keys[i - 1][0], va = keys[i - 1][1], b = keys[i][0], vb = keys[i][1]; if (t <= b) return lerp(va, vb, ease((t - a) / (b - a))); } return keys[keys.length - 1][1]; }; };
var SHAPES = [
  { x: kf([[0, 40], [4, 220], [8, 120], [12, 40]]), y: kf([[0, 60], [4, 30], [8, 150], [12, 60]]), r: kf([[0, 999], [3, 28], [6, 999], [9, 28], [12, 999]]), s: kf([[0, 1], [6, 1.25], [12, 1]]), size: 150, c: 'rgba(168,83,46,0.32)' },
  { x: kf([[0, 230], [4, 90], [8, 260], [12, 230]]), y: kf([[0, 140], [4, 190], [8, 40], [12, 140]]), r: kf([[0, 28], [3, 999], [6, 28], [9, 999], [12, 28]]), s: kf([[0, 1.1], [6, 0.85], [12, 1.1]]), size: 120, c: 'rgba(69,52,37,0.16)' },
  { x: kf([[0, 150], [6, 10], [12, 150]]), y: kf([[0, 210], [6, 100], [12, 210]]), r: kf([[0, 999], [12, 999]]), s: kf([[0, 0.8], [3, 1.2], [6, 0.8], [9, 1.2], [12, 0.8]]), size: 90, c: 'rgba(255,255,255,0.85)' }
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: 0, paused: false }; }
  componentDidMount() {
    var self = this, start = performance.now(), last = 0;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var loop = function (now) {
      self.raf = requestAnimationFrame(loop);
      if (document.hidden || now - last < 33) return;
      last = now;
      if (!self.state.paused && (self.props.preset ?? 'Bentuk') === 'Bentuk') self.setState({ t: ((now - start) / 1000) % D });
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    var p = this.props.preset ?? 'Bentuk', t = this.state.t;
    var shapes = SHAPES.map(function (s, i) {
      return 'position: absolute; left: 0; top: 0; width: ' + s.size + 'px; height: ' + s.size + 'px; background: ' + s.c + '; border-radius: ' + Math.round(s.r(t)) + 'px; transform: translate(' + s.x(t).toFixed(1) + 'px,' + s.y(t).toFixed(1) + 'px) rotate(' + (t / D * 360 * (i % 2 ? -1 : 1)).toFixed(1) + 'deg) scale(' + s.s(t).toFixed(3) + ')';
    });
    var dots = [];
    for (var i = 0; i < 14; i++) {
      var size = 6 + (i * 7) % 12;
      dots.push('position: absolute; bottom: 0; left: ' + ((i * 53) % 370) + 'px; width: ' + size + 'px; height: ' + size + 'px; border-radius: 999px; background: ' + (i % 3 ? 'rgba(168,83,46,0.35)' : 'rgba(255,255,255,0.9)') + '; --d: ' + (7 + (i % 5) * 2) + 's; --l: -' + (i * 0.9).toFixed(1) + 's');
    }
    var self = this, pz = this.state.paused;
    return { paused: pz, playing: !pz, bgClass: pz ? 'is-paused' : '', pauseLabel: pz ? 'Putar animasi latar' : 'Jeda animasi latar', togglePause: function () { self.setState({ paused: !pz }); }, isShapes: p === 'Bentuk', shapes: shapes, isWave: p === 'Gelombang', isAurora: p === 'Aurora', isDots: p === 'Partikel', dots: dots };
  }
}
</script>
</body>
</html>
