<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pilih voucher atau ketik kode saat booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap">
<style>
body{margin:0}
a{color:#a8532e}
button,a,input{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #a8532e;outline-offset:2px}
button:disabled{cursor:not-allowed}
input:focus{outline:none;border-color:#a8532e !important;box-shadow:0 0 0 3px #f3e3d6}
input::placeholder{color:#a5947f}
</style>
</helmet>
<div style="width: 390px; height: 1320px; position: relative; overflow: hidden; background: #faf4ea; color: #453425; font-family: 'DM Sans', system-ui, sans-serif">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #e8dcc9">
    <a href="Jadwal.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #453425">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #75624d">Langkah 3 dari 3</span>
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px">Data diri &amp; bayar</h1>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 20px 16px 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nama" style="font-size: 15px; font-weight: 600">Nama lengkap</label>
      <input id="nama" autocomplete="name" value="Ayu Lestari" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #d9c9b3; background: #ffffff; color: #453425; font-size: 16px; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="wa" style="font-size: 15px; font-weight: 600">Nomor WhatsApp</label>
      <input id="wa" type="tel" autocomplete="tel" value="0812 3456 7890" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #d9c9b3; background: #ffffff; color: #453425; font-size: 16px; box-sizing: border-box">
    </div>

    <section aria-labelledby="voucher-h" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="voucher-h" style="margin: 0; font-size: 15px; font-weight: 600">Voucher</h2>

      <button type="button" aria-expanded="{{open}}" aria-controls="daftar-voucher" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 1px solid #d9c9b3; background: #ffffff; color: #453425; font: inherit; text-align: left; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8532e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"></path></svg>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{triggerTitle}}</span><span style="font-size: 13px; color: #75624d">{{triggerSub}}</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="{{chev}}"><path d="M6 9l6 6 6-6"></path></svg>
      </button>

      <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
        <div id="daftar-voucher" role="radiogroup" aria-label="Voucher tersedia" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{publicList}}" as="v" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{v.on}}" disabled="{{v.off}}" onClick="{{v.pick}}" style="{{v.style}}">
              <span aria-hidden="true" style="{{v.dot}}"></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 700; letter-spacing: 0.04em">{{v.code}}</span>
                <span style="font-size: 13px">{{v.desc}}</span>
                <span style="font-size: 12px; color: #75624d">{{v.note}}</span>
              </span>
              <span style="font-weight: 700">{{v.save}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
        <label for="kode" style="font-size: 14px; font-weight: 500">Punya kode dari Rias by Sekar?</label>
        <div style="display: flex; gap: 8px">
          <input id="kode" value="{{code}}" onInput="{{setCode}}" aria-invalid="{{hasError}}" aria-describedby="kode-msg" autocapitalize="characters" autocomplete="off" placeholder="Ketik kode" style="{{inputStyle}}">
          <button type="button" onClick="{{apply}}" style="height: 52px; padding: 0 18px; border-radius: 12px; border: 1px solid #453425; background: #ffffff; color: #453425; font-size: 15px; font-weight: 600; cursor: pointer">Pakai</button>
        </div>
        <sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
          <p id="kode-msg" role="alert" style="margin: 0; font-size: 13px; color: #b42318">{{error}}</p>
        </sc-if>
        <p style="margin: 0; font-size: 12px; color: #75624d">Coba kode rahasia TEMANLAMA.</p>
      </div>

      <sc-if value="{{applied}}" hint-placeholder-val="{{false}}">
        <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 14px; border-radius: 12px; background: #dcefe3; color: #17603d">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
          <span style="flex: 1"><strong style="letter-spacing: 0.04em">{{sel.code}}</strong> terpasang, hemat {{sel.save}}</span>
          <button type="button" onClick="{{remove}}" aria-label="Lepas voucher" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #17603d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
        </div>
      </sc-if>
    </section>

    <section aria-labelledby="rinci-h" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e8dcc9; border-radius: 20px; overflow: hidden">
      <h2 id="rinci-h" style="margin: 0; padding: 14px 16px 4px; font-size: 13px; font-weight: 500; color: #75624d">Makeup Wisuda, Sabtu 21 Nov 10.00</h2>
      <dl aria-live="polite" style="margin: 0; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
        <div style="display: flex; justify-content: space-between"><dt>Harga layanan</dt><dd style="margin: 0">Rp350.000</dd></div>
        <sc-if value="{{applied}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; justify-content: space-between; color: #17603d; font-weight: 600"><dt>Voucher {{sel.code}}</dt><dd style="margin: 0">−{{sel.save}}</dd></div>
        </sc-if>
      </dl>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; background: #fbf1e8; border-top: 1px solid #e8dcc9">
        <span style="font-size: 15px; font-weight: 600">Dibayar sekarang</span>
        <span style="font-size: 22px; font-weight: 700">{{total}}</span>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; background: #ffffff; border-top: 1px solid #e8dcc9">
    <a href="Bayar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #a8532e; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none">Bayar {{total}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: true, sel: 'WISUDA20', code: '', error: '' }; }
  renderVals() {
    var self = this, st = this.state, price = 350000;
    var fmt = function (n) { return 'Rp' + n.toLocaleString('id-ID'); };
    var V = {
      WISUDA20: { code: 'WISUDA20', desc: 'Diskon 20% Makeup Wisuda', note: 'Berlaku sampai 31 Des', cut: 70000, ok: true, pub: true },
      HEMATAKHIRTAHUN: { code: 'AKHIRTAHUN', desc: 'Potongan Rp50.000', note: 'Belum bisa dipakai: minimal Rp500.000', cut: 50000, ok: false, pub: true },
      TEMANLAMA: { code: 'TEMANLAMA', desc: 'Potongan Rp50.000 untuk pelanggan lama', note: 'Kode rahasia', cut: 50000, ok: true, pub: false }
    };
    var pubKeys = ['WISUDA20', 'HEMATAKHIRTAHUN'];
    var publicList = [{ code: 'Tanpa voucher', desc: 'Bayar harga normal', note: '', save: '', on: !st.sel, off: false, pick: function () { self.setState({ sel: null }); } }]
      .concat(pubKeys.map(function (k) { var v = V[k]; return { code: v.code, desc: v.desc, note: v.note, save: v.ok ? '−' + fmt(v.cut) : '', on: st.sel === k, off: !v.ok, pick: function () { self.setState({ sel: k, error: '' }); } }; }))
      .map(function (v) {
        return Object.assign(v, {
          style: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 14px; font: inherit; text-align: left; cursor: pointer; ' + (v.off ? 'background: #f5efe6; color: #75624d; border: 1px dashed #d9c9b3' : v.on ? 'background: #fffaf4; color: #453425; border: 2px solid #a8532e; padding: 11px 13px' : 'background: #ffffff; color: #453425; border: 1px solid #e8dcc9'),
          dot: 'width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; ' + (v.on ? 'border: 6px solid #a8532e; background: #ffffff' : 'border: 2px solid #c9b8a2')
        });
      });
    var s = st.sel ? V[st.sel] : null;
    var nOk = pubKeys.filter(function (k) { return V[k].ok; }).length;
    return {
      open: st.open, toggle: function () { self.setState({ open: !st.open }); },
      chev: 'transition: transform .2s; transform: rotate(' + (st.open ? '180' : '0') + 'deg)',
      triggerTitle: s ? s.code + ' dipilih' : 'Pilih voucher',
      triggerSub: nOk + ' voucher bisa dipakai di booking ini',
      publicList: publicList, code: st.code, hasError: !!st.error, error: st.error, applied: !!s,
      sel: s ? { code: s.code, save: fmt(s.cut) } : { code: '', save: '' },
      total: fmt(price - (s ? s.cut : 0)),
      setCode: function (e) { self.setState({ code: e.target.value.toUpperCase(), error: '' }); },
      apply: function () {
        var c = (st.code || '').trim().toUpperCase();
        if (c === 'TEMANLAMA') self.setState({ sel: 'TEMANLAMA', error: '', code: '' });
        else if (c === 'WISUDA20') self.setState({ sel: 'WISUDA20', error: '', code: '' });
        else self.setState({ error: c ? 'Kode "' + c + '" tidak ditemukan atau sudah berakhir.' : 'Ketik kode dulu.' });
      },
      remove: function () { self.setState({ sel: null }); },
      inputStyle: 'flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: 12px; background: #ffffff; color: #453425; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; box-sizing: border-box; border: ' + (st.error ? '2px solid #b42318' : '1px solid #d9c9b3')
    };
  }
}
</script>
</body>
</html>
