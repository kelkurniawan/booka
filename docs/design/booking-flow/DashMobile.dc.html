<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dashboard hari ini di HP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0a0a0a}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #0a0a0a;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #ffffff; color: #0a0a0a; font-family: 'Geist', system-ui, sans-serif; font-size: 14px">

  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e4e4e7">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #0a0a0a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">TD</span>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #71717a">Sab, 14 Nov</span><h1 style="margin: 0; font-size: 18px; font-weight: 600">Hari ini</h1></span>
    <button type="button" aria-label="Salin tautan halaman booking" style="width: 44px; height: 44px; border: 1px solid #e4e4e7; border-radius: 10px; background: #ffffff; color: #0a0a0a; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 16px">
    <section aria-labelledby="m-aksi" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="m-aksi" style="margin: 0; font-size: 14px; font-weight: 600">Perlu tindakan · 2</h2>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #0a0a0a; border-radius: 12px">
        <span style="font-weight: 600">Permintaan: Sewa Rooftop Privat</span>
        <span style="font-size: 13px; color: #71717a">Dimas · 40 orang · Sab 28 Nov 18.00</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="height: 44px; border: 1px solid #e4e4e7; border-radius: 10px; background: #ffffff; color: #0a0a0a; font-weight: 500; cursor: pointer">Tolak</button>
          <button type="button" style="height: 44px; border: 0; border-radius: 10px; background: #0a0a0a; color: #ffffff; font-weight: 500; cursor: pointer">Setujui</button>
        </div>
      </div>
      <a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border: 1px solid #e4e4e7; border-radius: 12px; text-decoration: none"><span><strong>Belum bayar</strong> · Rina, slot lepas 9 mnt</span><span aria-hidden="true">›</span></a>
    </section>

    <section aria-labelledby="m-agenda" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="m-agenda" style="margin: 0; font-size: 14px; font-weight: 600">Berikutnya</h2>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid #e4e4e7; border-radius: 12px; overflow: hidden">
        <sc-for list="{{next}}" as="n" hint-placeholder-count="4">
          <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #f4f4f5">
            <span style="width: 44px; font-weight: 600; font-variant-numeric: tabular-nums">{{n.time}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">{{n.name}}</span><span style="font-size: 12px; color: #71717a">{{n.sub}}</span></span>
            <button type="button" aria-pressed="{{n.done}}" aria-label="{{n.aria}}" onClick="{{n.toggle}}" style="{{n.btn}}">{{n.label}}</button>
          </li>
        </sc-for>
      </ol>
    </section>
  </div>

  <nav aria-label="Menu utama" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 18px; background: #ffffff; border-top: 1px solid #e4e4e7">
    <a href="DashMobile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Hari ini</a>
    <a href="DashBooking.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; color: #52525b"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Booking</a>
    <button type="button" aria-label="Tambah booking manual" style="justify-self: center; width: 48px; height: 48px; border: 0; border-radius: 999px; background: #0a0a0a; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <a href="TemaEditor.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; color: #52525b"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>Halaman</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; color: #52525b"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>Lainnya</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: {} }; }
  renderVals() {
    var self = this, d = this.state.done;
    var next = [['19.00', 'Bima & tim', '8 orang · Teras T4 · bayar di tempat'], ['19.30', 'Rina Wulandari', '20 orang · Rooftop · sisa Rp1.050.000'], ['20.30', 'Nadia', '2 orang · meja belum dipilih'], ['21.00', 'Fajar', '3 orang · Meja D3']].map(function (r) {
      var done = !!d[r[0]];
      return { time: r[0], name: r[1], sub: r[2], done: done, label: done ? '✓' : 'Hadir', aria: 'Tandai ' + r[1] + ' hadir',
        toggle: function () { var n = Object.assign({}, d); n[r[0]] = !done; self.setState({ done: n }); },
        btn: 'flex-shrink: 0; min-width: 64px; height: 44px; border-radius: 10px; font: inherit; font-weight: 500; cursor: pointer; ' + (done ? 'border: 1px solid #0a0a0a; background: #0a0a0a; color: #ffffff' : 'border: 1px solid #d4d4d8; background: #ffffff; color: #0a0a0a') };
    });
    return { next: next };
  }
}
</script>
</body>
</html>
